name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.8"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create build environment and install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          if errorlevel 1 exit /b 1

      - name: Prepare empty configuration folders
        shell: pwsh
        run: |
          # conf is ignored by Git, but setup.py includes these placeholders.
          foreach ($folder in @('tasks', 'host', 'scripts')) {
            $directory = Join-Path 'conf' $folder
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            New-Item -ItemType File -Path (Join-Path $directory '.gitkeep') -Force | Out-Null
          }

      - name: Build portable application
        shell: cmd
        run: call build.bat

      - name: Verify portable output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'release/DeployFlow/DeployFlow.exe' -PathType Leaf)) {
            throw 'build.bat did not generate release/DeployFlow/DeployFlow.exe.'
          }

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler was not found: $compiler"
          }
          & .\build_installer.bat $compiler
          if ($LASTEXITCODE -ne 0) {
            throw "build_installer.bat failed with exit code $LASTEXITCODE."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: DeployFlow-Windows-x64-Installer
          path: installer-output/*-Setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: DeployFlow-Windows-x64-Portable
          path: release/DeployFlow/
          include-hidden-files: true
          if-no-files-found: error

      - name: Prepare development release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'installer-output' -Filter '*-Setup.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -eq 0) {
            throw 'Expected exactly one non-empty installer in installer-output.'
          }
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination 'release-assets/DeployFlow-Windows-x64-Installer.exe'
          # Include the DeployFlow folder and hidden files in the portable ZIP.
          $source = (Resolve-Path -LiteralPath 'release/DeployFlow').Path
          $archive = Join-Path (Resolve-Path -LiteralPath 'release-assets').Path 'DeployFlow-Windows-x64-Portable.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
          )

      - name: Update latest development release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $repositoryApi = "$env:GITHUB_API_URL/repos/$env:GH_REPO"

          function Get-OptionalGitHubResource([string] $Uri) {
            try {
              Invoke-RestMethod -Uri $Uri -Headers $headers
            } catch {
              if ($null -ne $_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
                return $null
              }
              throw
            }
          }

          # A queued older build must not replace the current main development build.
          $main = Invoke-RestMethod -Uri "$repositoryApi/git/ref/heads/main" -Headers $headers
          if ($main.object.sha -ne $env:GITHUB_SHA) {
            Write-Host 'main has advanced; keeping artifacts and skipping the latest release update.'
            exit 0
          }

          $tag = Get-OptionalGitHubResource "$repositoryApi/git/ref/tags/latest"
          if ($null -eq $tag) {
            $payload = @{ ref = 'refs/tags/latest'; sha = $env:GITHUB_SHA } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$repositoryApi/git/refs" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          } else {
            $payload = @{ sha = $env:GITHUB_SHA; force = $true } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Uri "$repositoryApi/git/refs/tags/latest" -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
          }

          $commitUrl = "$env:GITHUB_SERVER_URL/$env:GH_REPO/commit/$env:GITHUB_SHA"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Development build from main.`n`nCommit: $commitUrl`nBuild: $runUrl`nBuilt at: $([DateTime]::UtcNow.ToString('u'))"
          $payload = @{
            tag_name = 'latest'
            target_commitish = $env:GITHUB_SHA
            name = 'Latest Development Build'
            body = $notes
            draft = $false
            prerelease = $true
            make_latest = 'false'
          } | ConvertTo-Json
          $release = Get-OptionalGitHubResource "$repositoryApi/releases/tags/latest"
          if ($null -eq $release) {
            $release = Invoke-RestMethod -Method Post -Uri "$repositoryApi/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          } else {
            $release = Invoke-RestMethod -Method Patch -Uri "$repositoryApi/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body $payload
          }

          # Remove assets only from this fixed development release, including obsolete names.
          do {
            $assets = Invoke-RestMethod -Uri "$repositoryApi/releases/$($release.id)/assets?per_page=100" -Headers $headers
            foreach ($asset in $assets) {
              Invoke-RestMethod -Method Delete -Uri "$repositoryApi/releases/assets/$($asset.id)" -Headers $headers | Out-Null
            }
          } while ($assets.Count -gt 0)
          gh release upload latest 'release-assets/DeployFlow-Windows-x64-Installer.exe' 'release-assets/DeployFlow-Windows-x64-Portable.zip' --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Release asset upload failed with exit code $LASTEXITCODE."
          }
